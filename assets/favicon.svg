<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hashir Junaid">
  <!-- A system diagram that reads as H: two services, one link, and the core
       node where the link is made. Backend, systems, the thing he builds. -->
  <rect width="64" height="64" rx="16" fill="#14203A"/>
  <g stroke="#7F9BE0" stroke-width="4.6" stroke-linecap="round">
    <path d="M17 15 V49 M47 15 V49"/>
    <path d="M17 32 H47"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="17" cy="15" r="4.8"/><circle cx="17" cy="49" r="4.8"/>
    <circle cx="47" cy="15" r="4.8"/><circle cx="47" cy="49" r="4.8"/>
  </g>
  <circle cx="32" cy="32" r="7.5" fill="#F2670E"/>
  <circle cx="32" cy="32" r="3" fill="#FFFFFF"/>
</svg>
